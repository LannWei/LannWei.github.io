name: Get Citation Data

# Fetches the Google Scholar citation count once a day (and after each Pages
# build) and publishes it to the `google-scholar-stats` branch, which the
# "citations" badge on the homepage reads through jsDelivr + shields.io.

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        id: fetch
        working-directory: google_scholar_crawler
        # Google Scholar often blocks CI runners; the script then exits cleanly
        # with ok=false and the badge keeps its last value.
        timeout-minutes: 4
        run: python -u main.py
        env:
          GOOGLE_SCHOLAR_ID: DOkab9UAAAAJ
      - name: Publish citation data
        if: steps.fetch.outputs.ok == 'true'
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          remote_repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        env:
          GH_TOKEN: ${{ github.token }}
